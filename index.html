<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Access Paperspace machine</title>
</head>
<body>
    <button type="button" data-action="start">Start Machine</button>
    <button type="button" data-action="stop">Shutdown Machine</button>
    <button type="button" data-action="restart">Restart Machine</button>

    <p>Machine status: <span id="statusText">getting status...</span></p>

    <script>
        const CONFIG = {
            machine: '<insert here>',
            token: '<insert here>'
        };

        const POLL_MS = 5000;
        const endpoint = 'https://api.paperspace.com/v1/machines/' + CONFIG.machine;
        const statusEl = document.getElementById('statusText');

        function callApi(method, path) {
            return fetch(endpoint + path, {
                method: method,
                headers: { Authorization: 'Bearer ' + CONFIG.token }
            });
        }

        // Ask Paperspace for the machine's current state and show it
        async function refreshStatus() {
            let res;
            try {
                res = await callApi('GET', '');
            } catch (err) {
                statusEl.textContent = 'unreachable';
                return;
            }

            const body = await res.json().catch(() => null);
            statusEl.textContent = res.ok && body
                ? body.state
                : 'error (' + res.status + ')';
        }

        // Each button sends its lifecycle action (start, stop, restart)
        document.querySelectorAll('button[data-action]').forEach((btn) => {
            btn.addEventListener('click', () => {
                callApi('PATCH', '/' + btn.dataset.action).catch(() => {});
            });
        });

        refreshStatus();
        setInterval(refreshStatus, POLL_MS);
    </script>
</body>
</html>
